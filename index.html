function checksBloque(b){ const bc=S.bc3[b.id]; const textos=bc&&bc.partidas?bc.partidas.map(p=>normB(p.resumen+' '+(p.texto||'')+' '+(p.capitulo||''))):[]; const st=((S.obra&&S.obra.bc3check)||{})[b.id]||{};

function hdims(h){ const c=h.tipo&&S.carp[h.tipo]; return c?{w:num(c.w)||0,h:num(c.h)||0}:{w:num(h.w)||0,h:num(h.h)||0}; }
function derive(e){
  const L=num(e.largo), A=num(e.ancho), H=num(e.alto)||0;
  const sup = e.supManual!=null ? num(e.supManual) : (L&&A? r2(L*A):null);
  const per = e.perManual!=null ? num(e.perManual) : (L&&A? r2(2*(L+A)):null);
  const hp=(e.puertas||[]).reduce((s,h)=>{const d=hdims(h);return s+(num(h.n)||0)*d.w*d.h;},0);
  const ap=(e.puertas||[]).reduce((s,h)=>s+(num(h.n)||0)*hdims(h).w,0);
  const hv=(e.ventanas||[]).reduce((s,h)=>{const d=hdims(h);return s+(num(h.n)||0)*d.w*d.h;},0);
  const nP=(e.puertas||[]).reduce((s,h)=>s+(num(h.n)||0),0), nV=(e.ventanas||[]).reduce((s,h)=>s+(num(h.n)||0),0);
  const brutas = per!=null&&H? r2(per*H):null;

/* ---------- lector BC3 (FIEBDC-3) en el navegador ---------- */
async function parseBc3File(file){
  const buf=await file.arrayBuffer(); let txt=new TextDecoder('windows-1252').decode(buf);
  const head=txt.slice(0,400); if(/UTF-?8/i.test(head)){ txt=new TextDecoder('utf-8').decode(buf); }
  const recs=txt.split('~'); const C={},D={},T={},M={};
  for(const r of recs){ const f=r.replace(/\r?\n/g,'').split('|'); const t=f[0];
    if(t==='C'){ const code=(f[1]||'').replace(/\\0$/,''); C[code]={ud:f[2]||'',res:f[3]||'',pr:parseFloat((f[4]||'0').split('\\')[0].replace(',','.'))||0,tipo:f[6]||'0'}; }
    else if(t==='D'){ const parts=(f[2]||'').split('\\'); const ch=[]; for(let i=0;i+2<parts.length;i+=3){ if(parts[i]) ch.push({c:parts[i],f:parseFloat(parts[i+1].replace(',','.'))||1,r:parseFloat(parts[i+2].replace(',','.'))||0}); } D[f[1]]=ch; }
    else if(t==='T'){ T[f[1]]=(f[2]||'').trim(); }
    else if(t==='M'){ const ids=(f[1]||'').split('\\'); const child=ids[ids.length-1]; const tot=parseFloat((f[3]||'0').replace(',','.'))||0; M[child]=(M[child]||0)+tot; }
  }
  const norm=c=>(c in C)?c:((c+'#') in C?c+'#':c);
  const isCap=c=>c.endsWith('#');
  const root=Object.keys(C).find(k=>k.endsWith('##'))||Object.keys(D).find(k=>k.endsWith('##'));
  const partidas=[]; const seen=new Set();
  const walk=(node,path)=>{ (D[node]||[]).forEach(ch=>{ const k=norm(ch.c); if(isCap(k)){ walk(k, path.concat((C[k]||{}).res||k.replace(/#+$/,''))); } else if(!seen.has(k)&&C[k]){ seen.add(k); const med=M[k]!=null?M[k]:ch.r; const pr=C[k].pr; partidas.push({cod:k,ud:C[k].ud,resumen:C[k].res,texto:(T[k]||'').slice(0,700),precio:pr,med:Math.round(med*100)/100,importe:Math.round(med*pr*100)/100,capitulo:path.slice(-2).join(' / ')}); } }); };
  if(root) walk(root,[]); 
  if(!partidas.length){ Object.keys(D).filter(isCap).forEach(k=>walk(k,[(C[k]||{}).res||k])); }
  if(!partidas.length) throw new Error('no se han encontrado partidas (¿es un BC3 de presupuesto?)');
  const total=Math.round(partidas.reduce((s,p)=>s+p.importe,0)*100)/100;
  let out={archivo:file.name,fecha:new Date().toISOString().slice(0,10),n:partidas.length,total,partidas,conDescompuestos:Object.keys(D).filter(k=>!isCap(k)).length};
  if(JSON.stringify(out).length>230000){ out.partidas=partidas.map(p=>({...p,texto:''})); out.textosOmitidos=true; }
  if(JSON.stringify(out).length>230000){ out.partidas=out.partidas.slice(0,800); out.truncado=true; }
  return out;
}

function parseCsvLinea(line,sep){ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; } else { if(ch==='"') q=true; else if(ch===sep){ out.push(cur); cur=''; } else cur+=ch; } } out.push(cur); return out; }
async function importarCatalogoCsv(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) throw new Error('archivo vacío'); const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const head=parseCsvLinea(lines[0],sep).map(h=>normTxt(h).toUpperCase().trim()); const idx=n=>head.indexOf(n); const iC=idx('COD'), iR=idx('RESUMEN'); if(iC<0||iR<0) throw new Error('faltan las columnas COD y RESUMEN');
  const porCod={}; Object.values(S.catalogo).forEach(it=>{ porCod[it.cod]=it; }); let nuevos=0,act=0; const hoy=new Date().toISOString().slice(0,10);
  for(const l of lines.slice(1)){ const c=parseCsvLinea(l,sep); const cod=(c[iC]||'').trim().toUpperCase(); if(!cod) continue; const g=n=>{ const i=idx(n); return i>=0?(c[i]||'').trim():''; };
    const it=porCod[cod]||{id:'k'+uid(),cod}; it.cap=(g('CAP')||it.cap||'').toUpperCase(); it.ud=g('UD')||it.ud||'u'; it.resumen=(c[iR]||'').trim()||it.resumen||cod; it.descripcion=g('DESCRIPCION')||it.descripcion||''; const pr=num(g('PRECIO')); if(pr!=null) it.precio=pr; it.fuente=g('FUENTE')||it.fuente||'WVR'; it.proveedor=g('PROVEEDOR')||it.proveedor||''; it.url=g('URL')||it.url||''; it.fecha=hoy;
    if(porCod[cod]) act++; else { nuevos++; porCod[cod]=it; } await store.saveCatItem(it); }
  return {nuevos,actualizados:act};
}

  const t = id? {...S.tipos[id]} : {id:'t'+uid(), el:el||'PAV.SUELO', cod:nextTipoCod(el||'PAV.SUELO'), nombre:'', desc:''};

  $('#dlgBody').innerHTML=`<h3>${id?'Editar':'Nuevo'} acabado / equipo tipo</h3>
    <div class="row" style="margin-top:.8rem">
      <div class="f"><label>Elemento</label><select id="tEl" ${id?'disabled':''}>${Object.keys(TYPEABLE).map(k=>`<option value="${k}" ${k===t.el?'selected':''}>${esc(elNombre(k))}</option>`).join('')}</select></div>
      <div class="f"><label>Código</label><input id="tCod" value="${esc(t.cod)}" style="width:6rem"></div>
      <div class="f"><label>Nombre</label><input id="tNombre" value="${esc(t.nombre)}" placeholder="Porcelánico 60×60 gris / Pintura plástica blanca…" style="width:18rem;max-width:70vw"></div>
    </div>
    <div class="f" style="margin-top:.6rem"><label>Descripción / modelo / prestaciones</label><textarea id="tDesc" rows="3" placeholder="p. ej. gres porcelánico rectificado 60×60, acabado mate, colocado con adhesivo C2TE S1, junta 2 mm; o: lavabo suspendido 60 cm porcelana blanca + grifería monomando cromada">${esc(t.desc||'')}</textarea></div>
    <div class="card" style="margin-top:.8rem;padding:.7rem .9rem;background:var(--bg2,#f6f7f6)"><h3 style="margin:0 0 .3rem">Elegir de la base de precios (BPCM 2024)</h3>

      <div id="tRes" style="max-height:32vh;overflow:auto;margin-top:.4rem"></div>
      <div id="tBase" class="hint" style="margin-top:.4rem">${t.base?`Partida base: <b class="mono">${esc(t.base.cod)}</b> · ${esc(t.base.r||'')} · ${f2(t.base.p)} €/${esc(t.base.u||'')} <button class="g" id="tBaseQuitar">quitar</button>`:'Sin partida base (se creará como partida propia).'}</div>
    </div>
    <p class="hint">Cada tipo se convierte en una partida del presupuesto, con las estancias donde se usa como líneas de medición.</p>
    <div class="row" style="justify-content:flex-end;margin-top:.6rem"><button id="tCancel">Cancelar</button><button class="p" id="tOk">Guardar</button></div>`;
  dlg.showModal(); $('#tNombre').focus();
  $('#tEl').onchange=ev=>{ if(!id){ $('#tCod').value=nextTipoCod(ev.target.value); } buscarBase(); };
  const pintarBase=()=>{ $('#tBase').innerHTML=t.base?`Partida base: <b class="mono">${esc(t.base.cod)}</b> · ${esc(t.base.r||'')} · ${f2(t.base.p)} €/${esc(t.base.u||'')} <button class="g" id="tBaseQuitar">quitar</button>`:'Sin partida base (se creará como partida propia).'; const q=$('#tBaseQuitar'); if(q) q.onclick=()=>{ delete t.base; pintarBase(); }; };
  pintarBase();
  const buscarBase=async()=>{ const q=$('#tBusca').value.trim(); const res=$('#tRes'); if(q.length<2){ res.innerHTML=''; return; } $('#tBuscaMsg').textContent='…'; const capKey=(ELEMENTOS.find(e=>e.key===$('#tEl').value)||{}).cap||''; const hits=await baseBuscar(q,$('#tTodo').checked?'':capKey); $('#tBuscaMsg').textContent=hits.total?`${hits.total} resultados${hits.total>hits.items.length?' (se muestran '+hits.items.length+')':''}`:'sin resultados';
    res.innerHTML=hits.items.length?`<table><thead><tr><th>Código</th><th>Ud</th><th>Resumen</th><th class="num">Precio</th></tr></thead><tbody>${hits.items.map((r,i)=>`<tr data-i="${i}" style="cursor:pointer"><td class="mono">${esc(r.c)}${r.propio?' <span class="chip ok">PROPIO</span>':''}</td><td>${esc(r.u)}</td><td>${esc(r.r)}<div class="auto">${esc(r.g||'')}</div></td><td class="num">${f2(r.p)}</td></tr>`).join('')}</tbody></table>`:'';
    res.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=async()=>{ const r=hits.items[+tr.dataset.i]; t.base={cod:r.c,u:r.u,r:r.r,p:r.p}; if(!$('#tNombre').value.trim()) $('#tNombre').value=r.r.charAt(0)+r.r.slice(1).toLowerCase(); const d=await baseDesc(r.c); if(d&&!$('#tDesc').value.trim()) $('#tDesc').value=d; pintarBase(); toast('Partida '+r.c+' enlazada'); }); };
  let tmr=null; $('#tBusca').addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(buscarBase,250); }); $('#tTodo').addEventListener('change',buscarBase);
  if(t.ifc&&!t.base){ $('#tBuscaMsg').textContent='Este acabado viene del IFC ("'+t.ifc+'"): busca la partida real y enlázala para validar la descripción.'; }
  $('#tCancel').onclick=()=>dlg.close();

    const dup=Object.values(S.tipos).find(x=>x.cod===t.cod&&x.id!==t.id); if(dup){ toast('Ya existe el código '+t.cod); return; }
    S.tipos[t.id]=t; later('tipos',()=>store.saveTipos().then(()=>toast('Tipo guardado')));
    if(t.base){ S.mapa['TIP.'+t.cod]=t.base.cod; later('mapa',()=>store.saveMapa()); }
    dlg.close(); if(done) done(t); };
}

/* ---------- carpinterías (catálogo de la obra) ---------- */
function carpUsos(id){ let n=0; S.estancias.forEach(e=>[...(e.puertas||[]),...(e.ventanas||[])].forEach(h=>{ if(h.tipo===id) n+=(num(h.n)||0); })); return n; }
function carpTable(){
  const list=Object.values(S.carp).sort((a,b)=>a.cod.localeCompare(b.cod));
  if(!list.length) return `<div class="empty" style="padding:.8rem">Todavía no hay carpinterías definidas.</div>`;
  return `<div class="tbl"><table><thead><tr><th>Cód.</th><th>Tipo</th><th>Nombre</th><th class="num">Ancho</th><th class="num">Alto</th><th>De qué es / descripción</th><th class="num">Uds en obra</th><th>Código partida</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td class="mono"><b>${esc(c.cod)}</b></td><td>${esc((CARP_TIPOS[c.clase]||{}).n||c.clase)}</td><td>${esc(c.nombre)}</td><td class="num">${f2(c.w)}</td><td class="num">${f2(c.h)}</td><td class="auto">${esc(c.desc||'')}${c.extras&&Object.keys(c.extras).length?`<div class="auto">${Object.entries(c.extras).map(([k,v])=>`${k==='PER'?'persiana':k==='VID'?'vidrio':k}: ${esc(v.cod)}`).join(' · ')}</div>`:''}</td><td class="num">${carpUsos(c.id)}</td><td><input class="cod" data-cod="CAR.${esc(c.cod)}" value="${esc(S.mapa['CAR.'+c.cod]||'')}" placeholder="código partida"></td><td><button class="g" data-carpedit="${c.id}">editar</button><button class="g d" data-carpdel="${c.id}" title="eliminar">✕</button></td></tr>`).join('')}</tbody></table></div>`;
}
function bindCarpTable(m){
  m.querySelectorAll('[data-carpedit]').forEach(b=>b.onclick=()=>dlgCarp(b.dataset.carpedit,null,()=>render()));
  m.querySelectorAll('[data-carpdel]').forEach(b=>b.onclick=()=>{ const id=b.dataset.carpdel; const u=carpUsos(id); if(u>0){ toast('Se usa en '+u+' huecos: quítala primero de las estancias'); return; } delete S.carp[id]; later('carp',()=>store.saveCarp()); render(); });
  m.querySelectorAll('[data-cod]').forEach(i=>{ if(i._b) return; i._b=1; i.addEventListener('change',ev=>{S.mapa[ev.target.dataset.cod]=ev.target.value.trim(); later('mapa',()=>store.saveMapa().then(()=>toast('Códigos guardados')));}); });
}
function nextCarpCod(clase){ const used=new Set(Object.values(S.carp).map(c=>c.cod)); for(let i=1;i<100;i++){ const c=clase+String(i).padStart(2,'0'); if(!used.has(c)) return c; } return clase+'99'; }
function dlgCarp(id, clase, done){
  const c = id? {...S.carp[id]} : {id:'c'+uid(), clase:clase||'V', cod:nextCarpCod(clase||'V'), nombre:'', w:clase==='P'?0.8:1.2, h:clase==='P'?2.1:1.2, desc:''};
  const dlg=$('#dlg');
  $('#dlgBody').innerHTML=`<h3>${id?'Editar':'Nueva'} carpintería</h3>
    <div class="row" style="margin-top:.8rem">
      <div class="f"><label>Tipo</label><select id="cClase">${Object.entries(CARP_TIPOS).map(([k,v])=>`<option value="${k}" ${k===c.clase?'selected':''}>${v.n}</option>`).join('')}</select></div>
      <div class="f"><label>Código (como en planos)</label><input id="cCod" value="${esc(c.cod)}" style="width:6rem"></div>
      <div class="f"><label>Nombre</label><input id="cNombre" value="${esc(c.nombre)}" placeholder="Ventana dormitorios / Puerta paso lisa…" style="width:16rem;max-width:70vw"></div>
    </div>
    <div class="row" style="margin-top:.6rem">
      <div class="f"><label>Ancho (m)</label><input type="number" step="0.01" id="cW" value="${c.w}"></div>
      <div class="f"><label>Alto (m)</label><input type="number" step="0.01" id="cH" value="${c.h}"></div>
    </div>
    <div class="f" style="margin-top:.6rem"><label>De qué es / descripción</label><textarea id="cDesc" rows="3" placeholder="p. ej. aluminio lacado RPT, oscilobatiente 2 hojas, vidrio 4/16/4 bajo emisivo, persiana motorizada; o: puerta de paso lisa lacada blanca, 1 hoja, herrajes acero inox">${esc(c.desc||'')}</textarea></div>
    <p class="hint">Esta descripción es la que después convertimos en la partida (o con la que buscamos la partida equivalente en la base).</p>
    <div class="card" style="margin-top:.8rem;padding:.7rem .9rem;background:var(--bg2,#f6f7f6)"><h3 style="margin:0 0 .3rem">Enlazar con la base de precios y el catálogo propio</h3>
      <p class="hint" style="margin:0 0 .5rem">Busca la partida de la carpintería (aluminio, PVC, madera; batiente, corredera, oscilobatiente…) y, si procede, la persiana y el vidrio. Cada una genera su línea de medición: la carpintería por unidades, el vidrio en m² (ancho × alto × unidades) y la persiana por unidades.</p>
      ${CARP_SLOTS.map(sl=>`<div class="row" style="align-items:center;margin-top:.3rem"><b style="width:7rem">${sl.n}</b><input data-cs="${sl.k}" placeholder="${sl.ph}" style="width:20rem;max-width:55vw"><label class="cb" style="margin:0"><input type="checkbox" data-cstodo="${sl.k}"> toda la base</label><span class="hint" data-csmsg="${sl.k}" style="margin:0"></span></div><div data-csres="${sl.k}" style="max-height:24vh;overflow:auto"></div><div class="hint" data-cssel="${sl.k}" style="margin:.2rem 0 .4rem"></div>`).join('')}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:.6rem"><button id="cCancel">Cancelar</button><button class="p" id="cOk">Guardar</button></div>`;
  dlg.showModal(); $('#cNombre').focus();
  c.extras=c.extras||{};
  const pintarSel=k=>{ const el=$(`[data-cssel="${k}"]`); const v=k==='BASE'?c.base:c.extras[k]; el.innerHTML=v?`<b class="mono">${esc(v.cod)}</b> · ${esc(v.r||'')} · ${f2(v.p)} €/${esc(v.u||'')} <button class="g" data-csq="${k}">quitar</button>`:'<span style="color:var(--ink3,#888)">sin enlazar</span>'; const q=el.querySelector('[data-csq]'); if(q) q.onclick=()=>{ if(k==='BASE') delete c.base; else delete c.extras[k]; pintarSel(k); }; };
  CARP_SLOTS.forEach(sl=>{ pintarSel(sl.k); const inp=$(`[data-cs="${sl.k}"]`); const buscar=async()=>{ const q=inp.value.trim(); const res=$(`[data-csres="${sl.k}"]`); if(q.length<2){ res.innerHTML=''; return; } const capKey=$(`[data-cstodo="${sl.k}"]`).checked?'':(sl.k==='BASE'?((CARP_TIPOS[$('#cClase').value]||{}).cap||'CEX'):sl.cap); const hits=await baseBuscar(q,capKey); $(`[data-csmsg="${sl.k}"]`).textContent=hits.total?`${hits.total} resultados`:'sin resultados';
      res.innerHTML=hits.items.length?`<table><tbody>${hits.items.map((r,i)=>`<tr data-i="${i}" style="cursor:pointer"><td class="mono">${esc(r.c)}${r.propio?' <span class="chip ok">PROPIO</span>':''}</td><td>${esc(r.u)}</td><td>${esc(r.r)}</td><td class="num">${f2(r.p)}</td></tr>`).join('')}</tbody></table>`:'';
      res.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=async()=>{ const r=hits.items[+tr.dataset.i]; const v={cod:r.c,u:r.u,r:r.r,p:r.p}; if(sl.k==='BASE'){ c.base=v; if(!$('#cNombre').value.trim()) $('#cNombre').value=r.r.charAt(0)+r.r.slice(1).toLowerCase(); const d=await baseDesc(r.c); if(d&&!$('#cDesc').value.trim()) $('#cDesc').value=d; } else c.extras[sl.k]=v; res.innerHTML=''; pintarSel(sl.k); }); };
    let tmr=null; inp.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(buscar,250); }); $(`[data-cstodo="${sl.k}"]`).addEventListener('change',buscar); });
  $('#cClase').onchange=ev=>{ if(!id){ $('#cCod').value=nextCarpCod(ev.target.value); } };
  $('#cCancel').onclick=()=>dlg.close();
  $('#cOk').onclick=()=>{ c.clase=$('#cClase').value; c.cod=$('#cCod').value.trim().toUpperCase()||c.cod; c.nombre=$('#cNombre').value.trim()||(CARP_TIPOS[c.clase]||{}).n; c.w=num($('#cW').value)||0; c.h=num($('#cH').value)||0; c.desc=$('#cDesc').value.trim();
    const dup=Object.values(S.carp).find(x=>x.cod===c.cod&&x.id!==c.id); if(dup){ toast('Ya existe el código '+c.cod); return; }
    S.carp[c.id]=c; later('carp',()=>store.saveCarp().then(()=>toast('Carpintería guardada')));
    let mapaCambiado=false; if(c.base){ S.mapa['CAR.'+c.cod]=c.base.cod; mapaCambiado=true; } Object.entries(c.extras||{}).forEach(([k,v])=>{ S.mapa['CAR.'+c.cod+'.'+k]=v.cod; mapaCambiado=true; }); if(mapaCambiado) later('mapa',()=>store.saveMapa());
    dlg.close(); if(done) done(c); };
}
const CARP_SLOTS=[{k:'BASE',n:'Carpintería',ph:'p. ej. ventana aluminio oscilobatiente RPT / puerta paso lacada',cap:''},{k:'PER',n:'Persiana',ph:'p. ej. persiana aluminio motorizada',cap:'CEX'},{k:'VID',n:'Vidrio',ph:'p. ej. doble acristalamiento bajo emisivo 4/16/4',cap:'VID'}];

/* ---------- paso 1: obra ---------- */
function renderObra(m,f){
  const o=S.obra;
  m.innerHTML=`
  <div class="card"><div class="ey">Paso 1 · Obra</div><h2>Datos de la obra</h2>
    <p class="hint">Define las plantas antes de crear estancias: cada estancia cuelga de una planta y así la medición sale ordenada.</p>
    <div class="row">
      <div class="f"><label>Nombre</label><input id="oNombre" value="${esc(o.nombre)}" style="width:22rem;max-width:80vw"></div>
      <div class="f"><label>Dirección / municipio</label><input id="oDir" value="${esc(o.direccion||'')}" style="width:22rem;max-width:80vw"></div>
      <div class="f"><label>Altura libre habitual (m)</label><input type="number" step="0.01" id="oAlto" value="${o.altoDefecto??2.70}"></div>
    </div>
    <div class="f" style="margin-top:.8rem"><label>Plantas (una por línea, en orden de abajo arriba)</label><textarea id="oPlantas" rows="4">${esc((o.plantas||[]).join('\n'))}</textarea></div>
    <div class="f" style="margin-top:.8rem"><label>Notas para el equipo</label><textarea id="oNotas" rows="2">${esc(o.notas||'')}</textarea></div>
  </div>
  <div class="card"><h3>Importar desde Revit (IFC)</h3>
    <p class="hint">Sube el IFC del modelo (exportado según la guía: habitaciones en todos los espacios, IFC 2x3 Coordination View). Se crean solas las plantas, las estancias con su superficie, perímetro y altura, y sus puertas y ventanas con medidas reales; luego sólo hay que repasar el checklist de cada estancia.${o.ifc?` <span class="chip ok">IFC CARGADO</span> ${esc(o.ifc.archivo||'')} · ${o.ifc.estancias||0} estancias · ${o.ifc.huecos||0} huecos${o.ifc.supConst?` · sup. construida IFC ${f2(o.ifc.supConst)} m²`:''}`:''}</p>
    ${o.ifc&&o.ifc.muros&&o.ifc.muros.length?`<details><summary class="hint" style="cursor:pointer">Muros y tabiques leídos del IFC (${o.ifc.muros.length} tipos por planta · ${f2(o.ifc.muros.reduce((s,m)=>s+m.m2,0))} m² brutos) — salen en el resumen como líneas por tipo, para asignarles partida</summary><div class="tbl" style="max-height:30vh;overflow:auto"><table><thead><tr><th>Planta</th><th>Tipo</th><th class="num">Nº</th><th class="num">Long.</th><th class="num">Alto</th><th class="num">m²</th><th class="num">e (m)</th></tr></thead><tbody>${o.ifc.muros.map(m=>`<tr><td>${esc(m.planta)}</td><td>${esc(m.tipo)}</td><td class="num">${m.n}</td><td class="num">${f2(m.long)}</td><td class="num">${f2(m.alto)}</td><td class="num">${f2(m.m2)}</td><td class="num">${m.espesor!=null?f2(m.espesor):''}</td></tr>`).join('')}</tbody></table></div></details>`:''}
    <div class="row"><label class="p" style="cursor:pointer;display:inline-block;padding:.45rem .8rem;border-radius:6px;background:var(--proj);color:#fff">📐 Subir IFC <input type="file" accept=".ifc,.IFC" id="ifcFile" style="display:none"></label><span class="hint" id="ifcMsg" style="margin:0;align-self:center"></span></div>
  </div>
  <div class="card"><h3>Instalaciones y estructura: ¿se miden aquí o las aporta un industrial?</h3>
    <p class="hint">Si electricidad, fontanería o climatización las va a presupuestar un industrial con su propio documento (BC3 o presupuesto), no hace falta contar enchufes y puntos de luz estancia por estancia. Lo mismo con la estructura si viene de la ingeniería. Lo que se salte aquí queda registrado como "aportado por…" y no cuenta como pendiente.</p>
    <div class="row"><label class="cb"><input type="checkbox" id="oInst" ${o.instEnEstancias===false?'':'checked'}> Medir instalaciones (electricidad, fontanería, climatización) en cada estancia</label></div>
    <p class="hint" style="margin-top:.6rem">Los capítulos generales (estructura, cubierta, instalaciones generales…) se deciden uno a uno en el paso 3: "medir", "lo aporta un industrial" o "no aplica".</p>
  </div>
  <div class="card"><h3>Acabados y equipos tipo</h3><p class="hint">Define una vez el pavimento, el alicatado, la pintura, el falso techo, los sanitarios, los radiadores, las luminarias… (PAV01, ALI01, LAV01…). En cada estancia sólo se elige el tipo, y con ★ se aplica por defecto a todas las estancias del mismo tipo (todos los dormitorios, todos los baños). Cada tipo es una partida del presupuesto.</p>${tiposTable()}<div class="row" style="margin-top:.6rem"><button id="addTipo">+ Nuevo acabado / equipo tipo</button></div></div>
  <div class="card"><h3>Carpinterías de la obra</h3><p class="hint">Define aquí las ventanas y puertas con el nombre de los planos (V01, V02, P01…), sus medidas y de qué son. Luego, en cada estancia, sólo se elige el tipo y cuántas hay. Se pueden definir también sobre la marcha desde la estancia.</p>${carpTable()}<div class="row" style="margin-top:.6rem"><button id="addCarpV">+ Ventana</button><button id="addCarpP">+ Puerta</button></div></div>
  <div class="card"><h3>Catálogo propio de productos y partidas (compartido entre todas las obras)</h3><p class="hint">Aquí se guardan las partidas y productos que no están en la base BPCM o que queréis con vuestro precio: ventanas de un fabricante, un pavimento concreto, un equipo de aerotermia, precios negociados… Se puede añadir a mano o importar de un CSV/Excel, y aparece en todos los buscadores marcado como PROPIO. Es un repositorio vivo: lo que se cambia aquí lo ve todo el mundo al momento.</p>
    <div class="row"><button id="btnCatalogo">Abrir catálogo (${Object.keys(S.catalogo).length} elementos)</button></div></div>
  <div class="card"><h3>Tu nombre (para saber quién midió)</h3><div class="row"><input id="miNombre" value="${esc(S.nombre)}" placeholder="p. ej. Ana" style="width:14rem"></div></div>
  <div class="card"><h3>Cómo se usa</h3>
    <ol class="hint" style="padding-left:1.2rem">
      <li>Crea las estancias de cada planta (paso 2). Para cada una, mide largo, ancho y alto y anota puertas y ventanas: el asistente calcula suelo, techo, paredes netas, rodapié y alicatado.</li>

      <li>Haz lo mismo con los elementos generales de la casa (paso 3): cimentación, estructura, cubierta, instalaciones, urbanización…</li>
      <li>En el resumen (paso 4) se ve el avance y se exporta la medición lista para el presupuesto.</li>
    </ol></div>`;
  const save=()=>{ const t=S.obra||o; t.nombre=$('#oNombre').value.trim()||t.nombre; t.direccion=$('#oDir').value.trim(); t.altoDefecto=num($('#oAlto').value)||2.7; t.plantas=$('#oPlantas').value.split('\n').map(s=>s.trim()).filter(Boolean); t.notas=$('#oNotas').value; t.actualizado=Date.now(); later('obra',()=>store.saveObra().then(()=>toast('Guardado'))); };
  ['#oNombre','#oDir','#oAlto','#oPlantas','#oNotas'].forEach(s=>$(s).addEventListener('input',save));
  $('#oInst').addEventListener('change',ev=>{(S.obra||o).instEnEstancias=ev.target.checked; save();});
  $('#miNombre').addEventListener('input',e=>{S.nombre=e.target.value; try{localStorage.setItem('wv_nombre',S.nombre);}catch(x){}});
  $('#btnCatalogo').onclick=()=>dlgCatalogo();
  $('#ifcFile').addEventListener('change',async ev=>{ const f=ev.target.files[0]; if(!f) return; $('#ifcMsg').textContent='Leyendo '+f.name+'…'; try{ const txt=await f.text(); const r=ifcRead(txt); dlgIfc(r,f.name); $('#ifcMsg').textContent=''; }catch(e){ console.warn(e); $('#ifcMsg').textContent='No se pudo leer el IFC: '+(e.message||e); } });
  bindCarpTable(m); $('#addCarpV').onclick=()=>dlgCarp(null,'V',()=>render()); $('#addCarpP').onclick=()=>dlgCarp(null,'P',()=>render());

/* ---------- paso 2: lista de estancias ---------- */
function renderRooms(m,f){
  const plantas=(S.obra.plantas&&S.obra.plantas.length)?S.obra.plantas:['Planta única'];
  const byP={}; S.estancias.forEach(e=>{(byP[e.planta]=byP[e.planta]||[]).push(e);});
  const extra=Object.keys(byP).filter(p=>!plantas.includes(p));
  let html=`<div class="card"><div class="ey">Paso 2 · Estancias</div><h2>Recorre la casa estancia por estancia</h2><p class="hint">Cada tarjeta muestra su estado. Una estancia está completa cuando tiene dimensiones y ningún elemento pendiente.</p></div>`;
  plantas.concat(extra).forEach(p=>{
    const list=(byP[p]||[]).sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre));
    html+=`<div class="planta"><h3>${esc(p)}</h3><span class="chip">${list.length}</span><button class="g" data-add="${esc(p)}">+ Añadir estancia</button></div><div class="rooms">`;
    html+=list.map(e=>{const pr=progresoEst(e), d=derive(e); const chip=pr.completa?'<span class="chip ok">COMPLETA</span>':pr.dims?`<span class="chip warn">${pr.pend} PENDIENTES</span>`:'<span class="chip">SIN MEDIR</span>';
      return `<button class="room" data-room="${e.id}"><b>${esc(e.nombre)}</b><span class="m">${esc(TIPOS[e.tipo]?.n||e.tipo)} · ${d.sup!=null?f2(d.sup)+' m²':'—'}</span>${chip}</button>`;}).join('');
    if(!list.length) html+=`<div class="empty" style="grid-column:1/-1;padding:.8rem">Sin estancias en esta planta.</div>`;
    html+=`</div>`;
  });
  m.innerHTML=html;
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>dlgNuevaEstancia(b.dataset.add));
  m.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{S.roomId=b.dataset.room;render();window.scrollTo(0,0);});
  const done=S.estancias.filter(e=>progresoEst(e).completa).length;
  foot(f,`<span class="hint" style="margin:0">${done} de ${S.estancias.length} estancias completas</span><span class="sp"></span><button id="fPrev">← Obra</button><button class="p" id="fNext">Elementos generales →</button>`);
  $('#fPrev').onclick=()=>{S.step=1;render();}; $('#fNext').onclick=()=>{S.step=3;render();};
}
function dlgNuevaEstancia(planta){
  const dlg=$('#dlg'); const tipos=Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
  $('#dlgBody').innerHTML=`<h3>Nueva estancia · ${esc(planta)}</h3><div class="row" style="margin-top:.8rem">
    <div class="f"><label>Tipo</label><select id="nTipo">${tipos}</select></div>
    <div class="f"><label>Nombre</label><input id="nNombre" placeholder="Dormitorio 01"></div>
    <div class="f"><label>Cuántas iguales</label><input type="number" id="nCuantas" value="1" min="1" step="1" style="width:4.5rem"></div></div>
    <p class="hint">El tipo decide qué elementos aparecen en la lista (un baño trae sanitarios y alicatado; un dormitorio no).</p>
    <div class="row" style="justify-content:flex-end"><button id="nCancel">Cancelar</button><button class="p" id="nOk">Crear</button></div>`;
  dlg.showModal();
  const sug=()=>{const t=$('#nTipo').value; const n=S.estancias.filter(e=>e.tipo===t).length+1; $('#nNombre').placeholder=`${TIPOS[t].n} ${String(n).padStart(2,'0')}`;};
  $('#nTipo').onchange=sug; sug();
  $('#nCancel').onclick=()=>dlg.close();
  $('#nOk').onclick=async()=>{const t=$('#nTipo').value; const k=Math.max(1,+$('#nCuantas').value||1); const base=$('#nNombre').value.trim();
    for(let i=0;i<k;i++){const n=S.estancias.filter(e=>e.tipo===t).length+1+i; const nombre=base?(k>1?`${base} ${String(i+1).padStart(2,'0')}`:base):`${TIPOS[t].n} ${String(n).padStart(2,'0')}`;
      const e={id:'e'+uid(),planta,tipo:t,nombre,alto:S.obra.altoDefecto||2.7,puertas:[{n:1,w:0.8,h:2.1}],ventanas:[],elementos:{},orden:S.estancias.length+i,por:S.nombre,creado:Date.now()};
      if(t==='TER'||t==='GAR') e.puertas=[]; if(['SAL','DOR','DES','COC'].includes(t)) e.ventanas=[{n:1,w:1.2,h:1.2}];
      await store.saveEst(e); if(!S.db) S.estancias.push(e);}
    dlg.close(); if(!S.db) render(); toast('Estancia creada');};
}

/* ---------- paso 2b: editor de estancia ---------- */

  const hueco=(arr,kind)=>arr.map((h,i)=>{const d=hdims(h); const fixed=!!(h.tipo&&S.carp[h.tipo]); return `<div class="h"><input type="number" step="1" min="0" data-hk="${kind}" data-hi="${i}" data-hf="n" value="${h.n}" style="width:3.8rem" title="uds"><span>×</span><select data-ht="${kind}:${i}" style="max-width:15rem">${carpOpts(kind,h.tipo)}</select><input type="number" step="0.01" data-hk="${kind}" data-hi="${i}" data-hf="w" value="${d.w||''}" title="ancho" ${fixed?'disabled':''}><span>×</span><input type="number" step="0.01" data-hk="${kind}" data-hi="${i}" data-hf="h" value="${d.h||''}" title="alto" ${fixed?'disabled':''}><span>m</span><button class="g d" data-hdel="${kind}:${i}" title="quitar">✕</button></div>`;}).join('');
  const groups=[...new Set(els.map(x=>x.g))];
  const rows=groups.map(g=>`<tr class="grp"><td colspan="6">${g}</td></tr>`+els.filter(x=>x.g===g).map(el=>{
    const st=estadoEl(e,el); const q=cantidadEl(e,el,d); const nota=(e.elementos?.[el.key]?.nota)||'';

    if(TYPEABLE[el.key]){ const te=tipoEfectivo(e,el.key); const opts=Object.values(S.tipos).filter(t=>t.el===el.key).sort((a,b)=>a.cod.localeCompare(b.cod)).map(t=>`<option value="${t.id}" ${te&&te.id===t.id?'selected':''}>${esc(t.cod)} · ${esc(t.nombre)}</option>`).join('');
      tipoSel=`<div class="row" style="gap:.3rem;margin-top:.25rem;align-items:center"><select data-tsel="${el.key}" style="font-size:.78rem;padding:.15rem .3rem;max-width:14rem"><option value="">— sin tipo —</option>${opts}<option value="__new">+ definir nuevo…</option></select>${te?`<button class="g" data-tdef="${el.key}" title="usar por defecto en todas las estancias de tipo ${esc((TIPOS[e.tipo]||{}).n||e.tipo)}" style="font-size:.75rem">${te.def?'★ por defecto':'☆ hacer defecto'}</button>`:''}</div>`; }
    return `<tr class="${st==='no'?'no':''}"><td class="el">${esc(el.n)}<div class="auto">${el.key} · ${el.cap}</div>${tipoSel}</td>
      <td><div class="tri" data-k="${el.key}"><button class="${st==='pd'?'pd':''}" data-s="pd">pendiente</button><button class="${st==='si'?'si':''}" data-s="si">sí</button><button class="${st==='no'?'no':''}" data-s="no">no</button></div></td>
      <td class="num"><input type="number" step="0.01" data-q="${el.key}" value="${q.v??''}" class="${q.manual?'manual':''}" ${st==='no'?'disabled':''}></td>
      <td>${el.ud}</td><td class="auto">${q.manual?'manual':(q.v!=null?'propuesta':'—')}</td>
      <td><input class="nota" data-n="${el.key}" value="${esc(nota)}" placeholder="nota (modelo, plano, observación)"></td></tr>`;}).join('')).join('');
  m.innerHTML=`
  <div class="card"><div class="ey">Paso 2 · ${esc(e.planta)}</div><div class="row" style="align-items:center;justify-content:space-between"><h2 style="margin:0"><input id="rNombre" value="${esc(e.nombre)}" style="font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line2);width:16rem;max-width:70vw"></h2>
    <div class="row" style="align-items:center"><select id="rTipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${k===e.tipo?'selected':''}>${v.n}</option>`).join('')}</select>
    ${pr.completa?'<span class="chip ok">COMPLETA</span>':`<span class="chip warn">${pr.pend} PENDIENTES</span>`}</div></div>
    <h3 style="margin-top:1rem">Dimensiones</h3>
    <div class="row">
      <div class="f"><label>Largo (m)</label><input type="number" step="0.01" id="rL" value="${e.largo??''}"></div>

      <div class="f"><label>Alto libre (m)</label><input type="number" step="0.01" id="rH" value="${e.alto??''}"></div>
      <div class="f"><label>Superficie real (m²) <span title="si la estancia no es rectangular">*</span></label><input type="number" step="0.01" id="rS" value="${e.supManual??''}" placeholder="${d.sup!=null&&e.supManual==null?f2(d.sup):''}"></div>

      <div><div class="k">Rodapié</div><div class="v">${f2(d.rodapie)} m</div></div>
      ${HUMEDOS.includes(e.tipo)?`<div><div class="k">Alicatado</div><div class="v">${f2(d.alic)} m²</div></div>`:''}

    <div class="tbl"><table><thead><tr><th>Elemento</th><th>¿Aplica?</th><th class="num">Cantidad</th><th>Ud</th><th></th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table></div>

  const save=(re=true)=>{ e.actualizado=Date.now(); if(S.nombre) e.por=S.nombre; later('est'+e.id,()=>store.saveEst(e).then(()=>{$('#sync').textContent=S.db?'compartido · guardado':'guardado en este navegador';}),80); if(re) render(); };
  const bind=(sel,fn)=>{const el=$(sel); if(el) el.addEventListener('change',ev=>{fn(ev.target.value);save();});};

  $('#rObs').addEventListener('change',ev=>{e.obs=ev.target.value;save(false);});

  $('#rDel').onclick=()=>{ const dlg=$('#dlg'); $('#dlgBody').innerHTML=`<h3>¿Eliminar "${esc(e.nombre)}"?</h3><p class="hint">Se borran sus dimensiones y todos sus elementos.</p><div class="row" style="justify-content:flex-end"><button id="dCancel">Cancelar</button><button class="d" id="dOk">Eliminar</button></div>`; dlg.showModal(); $('#dCancel').onclick=()=>dlg.close(); $('#dOk').onclick=async()=>{ dlg.close(); await store.delEst(e.id); S.estancias=S.estancias.filter(x=>x.id!==e.id); S.roomId=null; render(); toast('Estancia eliminada'); }; };
  const list=S.estancias.slice().sort((a,b)=>(a.planta>b.planta)-(a.planta<b.planta)||(a.orden||0)-(b.orden||0)); const idx=list.findIndex(x=>x.id===e.id);
  foot(f,`<button id="fBack">← Lista de estancias</button><span class="sp"></span><button id="fPrevR" ${idx<=0?'disabled':''}>← Anterior</button><button class="p" id="fNextR" ${idx>=list.length-1?'disabled':''}>Siguiente estancia →</button>`);
  $('#fBack').onclick=()=>{S.roomId=null;render();};

async function selectObra(id){ S.obraId=id; S.roomId=null; S.step=1; const o=S.obras.find(x=>x.id===id); S.obra=o?{...o}:null; if(o) store.subscribe(); else render(); }
/* ---------- Lector IFC (Revit IFC2x3 / IFC4) · plantas, estancias, huecos ---------- */
function ifcRead(text){
  const E=new Map(); const re=/^#(\d+)=(\w+)\((.*)\);\s*$/gm; let m;
  while((m=re.exec(text))){ E.set(+m[1],[m[2],m[3]]); }
  const T=i=>{const e=E.get(i);return e?e[0]:'';}, A=i=>splitArgs(E.get(i)[1]);
  const cache=new Map();
  const nums=s=>{ const inner=s.slice(s.lastIndexOf('(')+1, s.indexOf(')', s.lastIndexOf('(')) ); const v=inner.split(',').map(Number).filter(x=>!isNaN(x)); while(v.length<3) v.push(0); return v; };
  const point=i=>nums(E.get(i)[1]), dir=i=>nums(E.get(i)[1]);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};
  const comb=(x,y,z,v)=>[0,1,2].map(i=>x[i]*v[0]+y[i]*v[1]+z[i]*v[2]);
  function axis3d(i){ const a=A(i); const o=point(ref(a[0])); let z=ref(a[1])?dir(ref(a[1])):[0,0,1]; let x=ref(a[2])?dir(ref(a[2])):[1,0,0]; const y=cross(z,x); x=cross(y,z); return [o,norm(x),norm(y),norm(z)]; }
  function axis2d(i){ const a=A(i); const o=point(ref(a[0])); const x=norm(ref(a[1])?dir(ref(a[1])):[1,0,0]); return [o,x,[-x[1],x[0],0]]; }
  function placement(i){ if(cache.has(i)) return cache.get(i); const a=A(i); let [o,x,y,z]=axis3d(ref(a[1])); if(ref(a[0])){ const [po,px,py,pz]=placement(ref(a[0])); o=[0,1,2].map(k=>po[k]+comb(px,py,pz,o)[k]); x=comb(px,py,pz,x); y=comb(px,py,pz,y); z=comb(px,py,pz,z); } const r=[o,x,y,z]; cache.set(i,r); return r; }
  const toWorld=(plc,pts)=>{ const [o,x,y]=placement(plc); return pts.map(([u,v])=>[o[0]+x[0]*u+y[0]*v, o[1]+x[1]*u+y[1]*v]); };
  function curvePts(c){ const t=T(c), a=A(c);
    if(t==='IFCPOLYLINE'){ let pts=refs(a[0]).map(p=>point(p).slice(0,2)); if(pts.length>1&&dist(pts[0],pts[pts.length-1])<1e-6) pts.pop(); return pts; }
    if(t==='IFCCOMPOSITECURVE'){ const pts=[]; refs(a[0]).forEach(seg=>{ const sa=A(seg); let sp=curvePts(ref(sa[2]))||[]; if(sa[1].trim()==='.F.') sp=sp.slice().reverse(); sp.forEach(p=>{ if(!pts.length||dist(pts[pts.length-1],p)>1e-6) pts.push(p); }); }); if(pts.length>1&&dist(pts[0],pts[pts.length-1])<1e-6) pts.pop(); return pts; }
    if(t==='IFCTRIMMEDCURVE'){ const basis=ref(a[0]), bt=T(basis);
      if(bt==='IFCCIRCLE'){ const ba=A(basis); const [o]=axis2d(ref(ba[0])); const r=+ba[1]; const ang=trim=>{ const mm=/IFCPARAMETERVALUE\(([-\d.E+]+)\)/.exec(trim); if(mm) return +mm[1]*Math.PI/180; const p=point(refs(trim)[0]); return Math.atan2(p[1]-o[1],p[0]-o[0]); };
        let a1=ang(a[1]), a2=ang(a[2]); const sense=a[3].trim()==='.T.'; if(sense&&a2<a1) a2+=2*Math.PI; if(!sense&&a2>a1) a2-=2*Math.PI; const n=Math.max(4,Math.floor(Math.abs(a2-a1)/(Math.PI/12))); const out=[]; for(let k=0;k<=n;k++){ const t2=a1+(a2-a1)*k/n; out.push([o[0]+r*Math.cos(t2),o[1]+r*Math.sin(t2)]); } return out; }
      if(bt==='IFCLINE'){ const p1=refs(a[1])[0], p2=refs(a[2])[0]; return (p1&&p2)?[point(p1).slice(0,2),point(p2).slice(0,2)]:[]; } }
    return []; }
  function profilePoly(prof){ const t=T(prof), a=A(prof);
    if(t==='IFCRECTANGLEPROFILEDEF'){ const [o,x,y]=axis2d(ref(a[2])); const w=+a[3], h=+a[4]; return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([u,v])=>[o[0]+x[0]*u+y[0]*v,o[1]+x[1]*u+y[1]*v]); }
    if(t==='IFCARBITRARYCLOSEDPROFILEDEF'||t==='IFCARBITRARYPROFILEDEFWITHVOIDS') return curvePts(ref(a[2]));
    return null; }
  function brepFootprint(item,plc){ const shell=ref(A(item)[0]); const faces=refs(A(shell)[0]); let best=null, zmin=Infinity, zmax=-Infinity;
    for(const f of faces){ const bnds=refs(A(f)[0]); if(!bnds.length) continue; const loop=ref(A(bnds[0])[0]); const pts=refs(A(loop)[0]).map(point); if(pts.length<3) continue;
      pts.forEach(p=>{ if(p[2]<zmin) zmin=p[2]; if(p[2]>zmax) zmax=p[2]; });
      let nx=0,ny=0,nz=0; for(let k=0;k<pts.length;k++){ const a=pts[k], b=pts[(k+1)%pts.length]; nx+=(a[1]-b[1])*(a[2]+b[2]); ny+=(a[2]-b[2])*(a[0]+b[0]); nz+=(a[0]-b[0])*(a[1]+b[1]); }
      const l=Math.hypot(nx,ny,nz)||1; if(nz/l<-0.9){ const poly=pts.map(p=>[p[0],p[1]]); const ar=area(poly); if(!best||ar>best[0]) best=[ar,poly]; } }
    if(!best) return [null,null]; return [plc?toWorld(plc,best[1]):best[1], isFinite(zmax-zmin)?zmax-zmin:null]; }
  // --- estructura
  const storeys=new Map(); const spaceStorey=new Map(), elemStorey=new Map();
  for(const [i,[t,a]] of E){ if(t==='IFCBUILDINGSTOREY'){ const aa=splitArgs(a); storeys.set(i,{id:i,nombre:ifcDecode(aa[2]),cota:+aa[9]||0}); } }
  for(const [i,[t,a]] of E){
    if(t==='IFCRELAGGREGATES'){ const aa=splitArgs(a); const parent=ref(aa[4]); if(storeys.has(parent)) refs(aa[5]).forEach(c=>spaceStorey.set(c,parent)); }
    else if(t==='IFCRELCONTAINEDINSPATIALSTRUCTURE'){ const aa=splitArgs(a); const st=ref(aa[5]); refs(aa[4]).forEach(c=>elemStorey.set(c,st)); } }
  // property sets por objeto (sólo valores simples)
  const psets=new Map();
  for(const [i,[t,a]] of E){ if(t!=='IFCRELDEFINESBYPROPERTIES') continue; const aa=splitArgs(a); const objs=refs(aa[4]); const ps=ref(aa[5]); if(!ps||T(ps)!=='IFCPROPERTYSET') continue; const props={}; refs(A(ps)[4]).forEach(pr=>{ if(T(pr)!=='IFCPROPERTYSINGLEVALUE') return; const pa=A(pr); const name=ifcDecode(pa[0]); const mv=/\(('?)(.*?)\1\)$/.exec(pa[2]||''); props[name]=mv?ifcDecode(mv[2]):(pa[2]||''); }); objs.forEach(o=>{ psets.set(o,Object.assign(psets.get(o)||{},props)); }); }
  const acab=(pp,keys)=>{ for(const k of keys){ if(pp[k]){ const v=String(pp[k]).trim(); if(v&&!/^(-+|no|n\/a|ninguno|sin)$/i.test(v)) return v; } } return ''; };
  const estancias=[], areas=[];
  for(const [i,[t,a]] of E){ if(t!=='IFCSPACE') continue; const aa=splitArgs(a); const nombre=aa[7]!=='$'?ifcDecode(aa[7]):''; const numero=ifcDecode(aa[2]); const plc=ref(aa[5]), shape=ref(aa[6]); let poly=null,h=null;
    if(shape){ for(const rep of refs(splitArgs(E.get(shape)[1])[2])){ for(const item of refs(splitArgs(E.get(rep)[1])[3])){ const it=T(item);
      if(it==='IFCFACETEDBREP'&&!poly){ [poly,h]=brepFootprint(item,plc); }
      if(it==='IFCEXTRUDEDAREASOLID'){ const ia=A(item); h=+ia[3]; let pts=profilePoly(ref(ia[0])); if(pts&&pts.length>2){ const [o,x,y]=axis3d(ref(ia[1])); pts=pts.map(([u,v])=>[o[0]+x[0]*u+y[0]*v,o[1]+x[1]*u+y[1]*v]); poly=plc?toWorld(plc,pts):pts; } } } } }
    const st=spaceStorey.get(i); const planta=storeys.has(st)?storeys.get(st).nombre:'';
    if(/^(Área|Area)/.test(numero)){ areas.push({nombre,planta,sup:poly?r2(area(poly)):null}); continue; }
    const pp=psets.get(i)||{}; const acabados={suelo:acab(pp,['FloorCovering','Acabado del suelo','Floor Finish','Acabado de suelo']),pared:acab(pp,['WallCovering','Acabado de pared','Wall Finish','Acabado de la pared']),techo:acab(pp,['CeilingCovering','Acabado del techo','Ceiling Finish']),zocalo:acab(pp,['Base Finish','Acabado de la base','Rodapié'])};
    const tipo=ifcTipo(nombre); const e={id:i,numero,nombre:nombre||numero,tipo,planta,sup:poly?r2(area(poly)):null,per:poly?r2(perim(poly)):null,alto:h?r2(h):null,poly,puertas:[],ventanas:[],aviso:[],acabados};
    if(!poly) e.aviso.push('sin geometría'); if(!h) e.aviso.push('sin altura'); if(!tipo) e.aviso.push('cubierta / no habitable');
    estancias.push(e); }
  const huecos=[];
  for(const [i,[t,a]] of E){ if(t!=='IFCDOOR'&&t!=='IFCWINDOW') continue; const aa=splitArgs(a); const plc=ref(aa[5]); const tipo=aa[4]!=='$'?ifcDecode(aa[4]):ifcDecode(aa[2]); const h=+aa[8], w=+aa[9];
    if(!h||!w||h<0.5||w<0.3) continue; const o=plc?placement(plc)[0]:null; const st=elemStorey.get(i); const planta=storeys.has(st)?storeys.get(st).nombre:'';
    const hu={id:i,clase:t==='IFCDOOR'?'P':'V',tipo,w:r2(w),h:r2(h),planta,xy:o?o.slice(0,2):null,estancia:null,dist:null};
    if(o){ let best=null; for(const e of estancias){ if(!e.poly||!e.tipo||(planta&&e.planta!==planta)) continue; const d=distPoly(o,e.poly); if(!best||d<best[0]) best=[d,e]; }
      if(best&&best[0]<0.8){ hu.estancia=best[1].nombre; hu.estId=best[1].id; hu.dist=r2(best[0]); (hu.clase==='P'?best[1].puertas:best[1].ventanas).push(hu); } }
    huecos.push(hu); }
  // muros: tipo, nº, longitud (eje), altura (extrusión), espesor (capas de material)
  const matOf=new Map(); for(const [i,[t,a]] of E){ if(t!=='IFCRELASSOCIATESMATERIAL') continue; const aa=splitArgs(a); const m=ref(aa[5]); refs(aa[4]).forEach(o=>matOf.set(o,m)); }
  const espesor=m=>{ if(!m) return null; let ls=m; if(T(ls)==='IFCMATERIALLAYERSETUSAGE') ls=ref(A(ls)[0]); if(T(ls)!=='IFCMATERIALLAYERSET') return null; let th=0; refs(A(ls)[0]).forEach(l=>{ if(T(l)==='IFCMATERIALLAYER') th+=+A(l)[1]||0; }); return th||null; };
  const bodyH=(item,d=0)=>{ if(d>6) return 0; const t=T(item); if(t==='IFCEXTRUDEDAREASOLID') return +A(item)[3]||0; if(t==='IFCBOOLEANCLIPPINGRESULT'||t==='IFCBOOLEANRESULT') return bodyH(ref(A(item)[1]),d+1); if(t==='IFCFACETEDBREP'){ let zmin=Infinity,zmax=-Infinity; refs(A(ref(A(item)[0]))[0]).forEach(f=>{ const bnds=refs(A(f)[0]); if(!bnds.length) return; refs(A(ref(A(bnds[0])[0]))[0]).forEach(p=>{ const z=point(p)[2]; if(z<zmin) zmin=z; if(z>zmax) zmax=z; }); }); return isFinite(zmax-zmin)?zmax-zmin:0; } return 0; };
  const muros={};
  for(const [i,[t,a]] of E){ if(t!=='IFCWALL'&&t!=='IFCWALLSTANDARDCASE') continue; const aa=splitArgs(a); const tipo=(aa[4]!=='$'?ifcDecode(aa[4]):ifcDecode(aa[2]).replace(/:\d+$/,''))||'Muro'; const shape=ref(aa[6]); let len=0,hgt=0;
    if(shape){ for(const rep of refs(splitArgs(E.get(shape)[1])[2])){ const ra=splitArgs(E.get(rep)[1]); const ident=ra[1].replace(/'/g,''); for(const item of refs(ra[3])){ if(ident==='Axis'){ const pts=curvePts(item); for(let k=1;k<pts.length;k++) len+=dist(pts[k-1],pts[k]); } else if(ident==='Body'){ hgt=Math.max(hgt,bodyH(item)); } } } }
    const st=elemStorey.get(i); const planta=storeys.has(st)?storeys.get(st).nombre:''; const key=tipo+'|'+planta; const m=muros[key]||(muros[key]={tipo,planta,n:0,long:0,m2:0,alto:0,espesor:espesor(matOf.get(i))});
    m.n++; m.long+=len; m.m2+=len*hgt; m.alto=Math.max(m.alto,hgt); }
  const murosArr=Object.values(muros).map(m=>({...m,long:r2(m.long),m2:r2(m.m2),alto:r2(m.alto),espesor:m.espesor!=null?r2(m.espesor):null}));
  const plantas=[...storeys.values()].sort((a,b)=>a.cota-b.cota);
  return {plantas,estancias,huecos,areas,muros:murosArr};
  function ref(s){ const mm=/^\s*#(\d+)/.exec(s); return mm?+mm[1]:null; }
  function refs(s){ return (s.match(/#\d+/g)||[]).map(x=>+x.slice(1)); }
  function dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1]); }
  function area(p){ let s=0; for(let i=0;i<p.length;i++){ const q=p[(i+1)%p.length]; s+=p[i][0]*q[1]-q[0]*p[i][1]; } return Math.abs(s)/2; }
  function perim(p){ let s=0; for(let i=0;i<p.length;i++) s+=dist(p[i],p[(i+1)%p.length]); return s; }
  function pip(pt,poly){ let ins=false; const n=poly.length; for(let i=0;i<n;i++){ const [x1,y1]=poly[i], [x2,y2]=poly[(i+1)%n]; if((y1>pt[1])!==(y2>pt[1]) && pt[0]<(x2-x1)*(pt[1]-y1)/((y2-y1)||1e-12)+x1) ins=!ins; } return ins; }
  function distPoly(pt,poly){ if(pip(pt,poly)) return 0; let best=1e9; const n=poly.length; for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n]; const l2=dist(a,b)**2||1e-12; const t=Math.max(0,Math.min(1,((pt[0]-a[0])*(b[0]-a[0])+(pt[1]-a[1])*(b[1]-a[1]))/l2)); best=Math.min(best,dist(pt,[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])])); } return best; }
  function r2(n){ return Math.round(n*100)/100; }
}
function splitArgs(s){ const out=[]; let depth=0,cur='',q=false; for(const ch of s){ if(ch==="'") q=!q; if(!q){ if(ch==='(') depth++; else if(ch===')') depth--; else if(ch===','&&depth===0){ out.push(cur); cur=''; continue; } } cur+=ch; } out.push(cur); return out; }
function ifcDecode(s){ s=String(s).replace(/^'|'$/g,''); s=s.replace(/\\X2\\([0-9A-F]+)\\X0\\/g,(m,h)=>h.match(/.{4}/g).map(c=>String.fromCharCode(parseInt(c,16))).join('')); s=s.replace(/\\X\\([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16))); return s.replace(/\\'/g,"'"); }
const IFC_TIPOS=[['DORMITORIO','DOR'],['HABITACI','DOR'],['BAÑO','BAN'],['BANO','BAN'],['ASEO','ASE'],['COCINA','COC'],['SALÓN','SAL'],['SALON','SAL'],['COMEDOR','SAL'],['ESTAR','SAL'],['CIRCULACI','DIS'],['DISTRIBUIDOR','DIS'],['PASILLO','DIS'],['HALL','VES'],['VESTÍBULO','VES'],['VESTIBULO','VES'],['ENTRADA','VES'],['DESPACHO','DES'],['ESTUDIO','DES'],['OFICINA','DES'],['VESTIDOR','VTD'],['CLÓSET','VTD'],['CLOSET','VTD'],['ARMARIO','TRA'],['LAVADERO','LAV'],['PLANCHA','LAV'],['LIMPIEZA','LAV'],['ESCALERA','ESC'],['GARAJE','GAR'],['GARAGE','GAR'],['TRASTERO','TRA'],['INSTALACION','TRA'],['DESPENSA','TRA'],['ALMAC','TRA'],['TERRAZA','TER'],['PORCHE','TER'],['BALC','TER'],['PISCINA','TER'],['BBQ','TER'],['JARD','TER'],['PATIO','TER'],['EXTERIOR','TER'],['GIMNASIO','PIS'],['NIÑOS','SAL'],['JUEGOS','SAL'],['CINE','SAL'],['BODEGA','TRA'],['CUBIERTA',null]];
function ifcTipo(nombre){ const n=(nombre||'').toUpperCase(); for(const [k,t] of IFC_TIPOS){ if(n.includes(k)) return t; } return 'PIS'; }

function tituloEstancia(nombre,numero){ const small=new Set(['de','del','la','el','los','las','y','en','para','no','a']); const t=(nombre||'').toLowerCase().split(/\s+/).map((w,i)=>(i&&small.has(w))?w:w.replace(/^\S/,c=>c.toUpperCase())).join(' '); return numero&&!/^\d+$/.test(nombre||'')? `${t} ${numero}`:t; }
function ordenarEst(r,est){ const ordenPlanta=Object.fromEntries(r.plantas.map((p,i)=>[p.nombre,i])); const numN=x=>{ const n=parseInt(String(x).replace(/\D/g,'')); return isNaN(n)?9999:n; }; return est.slice().sort((a,b)=>((ordenPlanta[a.planta]??99)-(ordenPlanta[b.planta]??99))||(numN(a.numero)-numN(b.numero))||a.nombre.localeCompare(b.nombre)); }
function dlgIfc(r,archivo){
  const dlg=$('#dlg'); const est=ordenarEst(r,r.estancias.filter(e=>e.tipo)); const noHab=r.estancias.filter(e=>!e.tipo); const sin=r.huecos.filter(h=>!h.estancia);
  const plantas=r.plantas.filter(p=>est.some(e=>e.planta===p.nombre));
  const supConst=r2(r.areas.filter(a=>/const/i.test(a.nombre)).reduce((s,a)=>s+(a.sup||0),0));
  $('#dlgBody').innerHTML=`<h3>Importar IFC · ${esc(archivo)}</h3>
    <p class="hint">${plantas.length} plantas · ${est.length} estancias habitables · ${r.huecos.length} puertas/ventanas (${r.huecos.length-sin.length} asignadas a estancia)${supConst?` · superficie construida (áreas de Revit) ${f2(supConst)} m²`:''}${noHab.length?` · ${noHab.length} espacios de cubierta se ignoran`:''}</p>
    <div class="tbl" style="max-height:40vh;overflow:auto"><table><thead><tr><th>Planta</th><th>Estancia</th><th>Tipo</th><th class="num">Sup.</th><th class="num">Per.</th><th class="num">Alto</th><th class="num">P</th><th class="num">V</th><th>Aviso</th></tr></thead><tbody>
    ${est.map(e=>`<tr><td>${esc(e.planta)}</td><td>${esc(tituloEstancia(e.nombre,e.numero))}</td><td>${TIPOS[e.tipo]?TIPOS[e.tipo].n:e.tipo}</td><td class="num">${f2(e.sup)}</td><td class="num">${f2(e.per)}</td><td class="num">${f2(e.alto)}</td><td class="num">${e.puertas.reduce((s,h)=>s+1,0)}</td><td class="num">${e.ventanas.length}</td><td class="auto">${esc(e.aviso.join(', '))}</td></tr>`).join('')}
    </tbody></table></div>
    ${(()=>{ const ac={}; est.forEach(e=>{ ['suelo','pared','techo'].forEach(k=>{ const v=e.acabados&&e.acabados[k]; if(v){ ac[k]=ac[k]||{}; ac[k][v]=(ac[k][v]||0)+1; } }); }); const ks=Object.keys(ac); return ks.length?`<p class="hint" style="margin-top:.5rem"><b>Acabados leídos de las habitaciones:</b> ${ks.map(k=>k+': '+Object.entries(ac[k]).map(([c,n])=>c+' ('+n+')').join(', ')).join(' · ')}. Se crean como acabados tipo y se asignan a cada estancia; después se enlazan con la base para validar la descripción.</p>`:''; })()}
    ${r.muros&&r.muros.length?`<details style="margin-top:.5rem"><summary class="hint" style="cursor:pointer">Muros y tabiques del modelo (${r.muros.length} tipos por planta) — se incorporan como líneas de medición por tipo</summary><div class="tbl" style="max-height:30vh;overflow:auto"><table><thead><tr><th>Planta</th><th>Tipo de muro</th><th class="num">Nº</th><th class="num">Long. (m)</th><th class="num">Alto</th><th class="num">m² brutos</th><th class="num">Espesor</th></tr></thead><tbody>${r.muros.filter(m=>m.m2>0).map(m=>`<tr><td>${esc(m.planta)}</td><td>${esc(m.tipo.replace(/^Muro básico:/,''))}</td><td class="num">${m.n}</td><td class="num">${f2(m.long)}</td><td class="num">${f2(m.alto)}</td><td class="num">${f2(m.m2)}</td><td class="num">${m.espesor!=null?f2(m.espesor):''}</td></tr>`).join('')}</tbody></table></div></details>`:''}
    ${sin.length?`<p class="hint" style="margin-top:.5rem">Huecos sin estancia asignada (se anotan en la obra para revisarlos): ${sin.map(h=>esc(h.tipo.split(':').slice(-1)[0]+' '+f2(h.w)+'×'+f2(h.h))).join(' · ')}</p>`:''}
    <div class="row" style="margin-top:.8rem;align-items:center"><label class="cb"><input type="checkbox" id="ifcBorrar" ${S.estancias.length?'checked':''}> Sustituir las ${S.estancias.length} estancias existentes de esta obra</label></div>
    <div class="row" style="justify-content:flex-end;margin-top:.8rem"><button id="ifcCancel">Cancelar</button><button class="p" id="ifcOk">Crear ${est.length} estancias</button></div>`;
  dlg.showModal();
  $('#ifcCancel').onclick=()=>dlg.close();
  $('#ifcOk').onclick=async()=>{ const borrar=$('#ifcBorrar').checked; dlg.close(); try{ await importarIfc(r,archivo,{plantas,est,supConst,borrar}); toast('IFC importado: '+est.length+' estancias'); render(); }catch(e){ console.warn(e); toast('Error al importar: '+(e.message||e)); } };
}
async function importarIfc(r,archivo,{plantas,est,supConst,borrar}){
  // plantas (orden por cota), conservando las existentes que no vengan del IFC
  const nombresIfc=plantas.map(p=>p.nombre); const o=S.obra;
  const usadas=new Set(borrar?[]:S.estancias.map(e=>e.planta));
  o.plantas=[...nombresIfc, ...((o.plantas||[]).filter(p=>!nombresIfc.includes(p)&&usadas.has(p)))];
  est=ordenarEst(r,est);
  o.ifc={archivo,fecha:Date.now(),estancias:est.length,huecos:r.huecos.length,supConst:supConst||null,areas:r.areas.map(a=>({n:a.nombre,p:a.planta,s:a.sup})),huecosSin:r.huecos.filter(h=>!h.estancia).map(h=>({clase:h.clase,tipo:h.tipo,w:h.w,h:h.h,planta:h.planta}))};
  if(r.plantas.length&&!o.altoDefecto){ o.altoDefecto=2.7; }
  o.ifc.muros=(r.muros||[]).filter(m=>m.m2>0).map(m=>({tipo:m.tipo.replace(/^Muro básico:/,''),planta:m.planta,n:m.n,long:m.long,alto:m.alto,m2:m.m2,espesor:m.espesor}));
  await store.saveObra();
  // acabados tipo a partir de los códigos de acabado del IFC
  const ACAB_EL={suelo:'PAV.SUELO',pared:'PIN.PAREDES',techo:'FTE.TECHO'}; const tipoPorAcab={};
  est.forEach(e=>{ Object.entries(ACAB_EL).forEach(([k,el])=>{ const v=e.acabados&&e.acabados[k]; if(!v) return; const key=el+'|'+v; if(tipoPorAcab[key]) return; const ex=Object.values(S.tipos).find(t=>t.el===el&&(t.ifc===v||t.nombre===v)); if(ex){ tipoPorAcab[key]=ex.id; return; } const id='t'+uid(); S.tipos[id]={id,el,cod:nextTipoCod(el),nombre:v,desc:'Acabado según IFC: '+v+' (pendiente de enlazar con la base de precios)',ifc:v}; tipoPorAcab[key]=id; }); });
  if(Object.keys(tipoPorAcab).length) await store.saveTipos();
  // carpinterías: una por (clase, tipo IFC, ancho, alto)
  const carpKey=h=>`${h.clase}|${h.tipo}|${h.w}|${h.h}`; const carpMap={};
  const existentes=Object.values(S.carp);
  r.huecos.forEach(h=>{ if(!h.estancia) return; const k=carpKey(h); if(carpMap[k]) return;
    const ex=existentes.find(c=>c.ifc===k); if(ex){ carpMap[k]=ex.id; return; }
    const nombreT=h.tipo.split(':').slice(0,2).join(' · ').replace(/_/g,' '); const up=h.tipo.toUpperCase();
    let clase=h.clase==='P'?'P':'V'; if(/BALCON/.test(up)) clase='B'; else if(/GARAJE|GARAGE/.test(up)) clase='G'; else if(h.clase==='P'&&/ENTRADA|EXTERIOR/.test(up)&&!/HABITACION/.test(up)) clase='E';
    const id='c'+uid(); S.carp[id]={id,clase,cod:nextCarpCod(clase),nombre:nombreT,w:h.w,h:h.h,desc:'IFC',ifc:k}; carpMap[k]=id; });
  await store.saveCarp();
  // estancias
  if(borrar){ for(const e of S.estancias.slice()){ await store.delEst(e.id); } S.estancias=[]; }
  const agrupar=arr=>{ const g={}; arr.forEach(h=>{ const k=carpKey(h); const t=carpMap[k]; const kk=t||`${h.w}x${h.h}`; g[kk]=g[kk]||{n:0,w:h.w,h:h.h,tipo:t||undefined}; g[kk].n++; }); return Object.values(g); };
  let orden=S.estancias.length;
  const porPlanta={}; est.forEach(e=>{ porPlanta[e.planta]=(porPlanta[e.planta]||0)+1; });
  for(const e of est){
    const alto=e.alto||o.altoDefecto||2.7;
    const ne={id:'e'+uid(),planta:e.planta,tipo:e.tipo,nombre:tituloEstancia(e.nombre,e.numero),alto:r2(alto),largo:'',ancho:'',supManual:e.sup,perManual:e.per,puertas:agrupar(e.puertas),ventanas:agrupar(e.ventanas),elementos:{},orden:orden++,por:S.nombre||'IFC',creado:Date.now(),ifc:{id:e.id,numero:e.numero,nombre:e.nombre,aviso:e.aviso}};
    Object.entries(ACAB_EL).forEach(([k,el])=>{ const v=e.acabados&&e.acabados[k]; if(!v) return; const tid=tipoPorAcab[el+'|'+v]; if(tid) ne.elementos[el]={estado:'si',tipo:tid,por:'IFC'}; });
    if(!e.alto) ne.avisoIfc='sin altura en el IFC: se usa la altura por defecto';
    await store.saveEst(ne); if(!S.db) S.estancias.push(ne);
  }
}

async function init(){
  render();
  let db=null;
  try{ if(FIREBASE_CONFIG&&window.firebase){ firebase.initializeApp(FIREBASE_CONFIG); await firebase.auth().signInAnonymously(); db=firebase.firestore(); await db.collection('obras').limit(1).get(); } }catch(e){ console.warn('Firebase no disponible',e); db=null; }
  S.db=db; $('#sync').textContent = db?'compartido · en vivo':'sin conexión · sólo en este navegador'; $('#sync').classList.toggle('on',!!db);
  S.obras=await store.listObras();
  if(S.obras.length) await selectObra(S.obras[0].id); else render();
  if(db){ S.db.collection('catalogo').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ o[d.id]=clone(d.data()); o[d.id].id=d.id; }); S.catalogo=o; },e=>console.warn('catalogo',e)); } else { S.catalogo=(LS.load().catalogo)||{}; }
  if(db){ S.db.collection('obras').onSnapshot(q=>{ S.obras=q.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); renderObras(); },e=>console.warn(e)); }
  $('#selObra').onchange=ev=>selectObra(ev.target.value);
  $('#btnNuevaObra').onclick=()=>{ const dlg=$('#dlg'); $('#dlgBody').innerHTML=`<h3>Nueva obra</h3><div class="f" style="margin-top:.8rem"><label>Nombre de la obra</label><input id="obNombre" class="w" placeholder="Vivienda unifamiliar · Calle …"></div><div class="f" style="margin-top:.6rem"><label>Plantas (una por línea)</label><textarea id="obPlantas" rows="3">Planta baja
Planta primera</textarea></div><div class="row" style="justify-content:flex-end;margin-top:.8rem"><button id="obCancel">Cancelar</button><button class="p" id="obOk">Crear obra</button></div>`; dlg.showModal(); $('#obNombre').focus();
    $('#obCancel').onclick=()=>dlg.close();
    $('#obOk').onclick=async()=>{ const n=$('#obNombre').value.trim(); if(!n){ $('#obNombre').focus(); return; } const plantas=$('#obPlantas').value.split('\n').map(x=>x.trim()).filter(Boolean); dlg.close();
      try{ const id=await store.crearObra({nombre:n,plantas:plantas.length?plantas:['Planta única'],altoDefecto:2.7}); S.obras=await store.listObras(); await selectObra(id); toast('Obra creada'); }catch(e){ console.warn(e); toast('No se pudo crear la obra: '+(e&&e.message||e)); } };
  };
}
init();
